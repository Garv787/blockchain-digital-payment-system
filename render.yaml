databases:
  - name: payment-system-postgres
    databaseName: payment_system
    user: payment_system_user

services:
  - type: web
    name: payment-system-backend
    runtime: python
    rootDir: backend
    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: |
      gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120

    healthCheckPath: /health

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payment-system-postgres
          property: connectionString

      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: CORS_ORIGINS
        value: https://your-frontend.onrender.com

      - key: SECRET_KEY
        generateValue: true

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

      - key: SEPOLIA_RPC_URL
        sync: false

      - key: CONTRACT_ADDRESS
        sync: false

      - key: PRIVATE_KEY
        sync: false

      - key: ETHERSCAN_API_KEY
        sync: false